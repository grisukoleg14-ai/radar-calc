name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Упрощенная и безопасная установка зависимостей РЛС
      - name: Install Android SDK/NDK system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y lld libssl-dev libffi-dev

      - name: Install Pip Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          # Автоматически соглашаемся с лицензиями и запускаем компиляцию
          yes y | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarCalc-APK
          path: bin/*.apk
