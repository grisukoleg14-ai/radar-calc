name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Android SDK/NDK system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y lld libssl-dev libffi-dev

      - name: Install Pip Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      # Исправленный шаг кэширования через сверхнадежное зеркало Kernel.org и утилиту curl
      - name: Pre-cache problematic downloads (freetype and png)
        run: |
          # 1. Скачиваем библиотеки через curl (проходит проверки Cloudflare) и официальное зеркало Kernel.org
          curl -L -o freetype-2.14.1.tar.gz https://mirrors.kernel.org/gnu/freetype/freetype-2.14.1.tar.gz
          curl -L -o libpng-1.6.40.tar.gz https://downloads.sourceforge.net/project/libpng/libpng16/1.6.40/libpng-1.6.40.tar.gz

          # 2. Создаем папки кэша
          mkdir -p /home/runner/.buildozer/android/packages/freetype
          mkdir -p /home/runner/.buildozer/android/packages/png
          mkdir -p /home/runner/.local/share/python-for-android/packages/freetype
          mkdir -p /home/runner/.local/share/python-for-android/packages/png
          mkdir -p ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          mkdir -p ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/png

          # 3. Раскладываем файлы по всем путям кэша
          cp freetype-2.14.1.tar.gz /home/runner/.buildozer/android/packages/freetype/
          cp freetype-2.14.1.tar.gz /home/runner/.local/share/python-for-android/packages/freetype/
          cp freetype-2.14.1.tar.gz ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/

          cp libpng-1.6.40.tar.gz /home/runner/.buildozer/android/packages/png/
          cp libpng-1.6.40.tar.gz /home/runner/.local/share/python-for-android/packages/png/
          cp libpng-1.6.40.tar.gz ./.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/png/
          
          echo "Кэширование для обхода блокировок успешно выполнено!"

      - name: Build APK with Buildozer
        run: |
          # Автоматически соглашаемся с лицензиями и запускаем компиляцию
          yes y | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarCalc-APK
          path: bin/*.apk
